name: AutoBlog Publish

# ═══════════════════════════════════════════════════════════════
# 예약 발행 없음 (2026-09-13 결정: AdSense 재심사 준비 중에는 사람이 검토한 글만 공개)
# - 모든 글은 WordPress 초안으로만 저장됩니다(EDITORIAL_REVIEW_REQUIRED). 편집자가 확인한 뒤 WordPress에서 직접 공개합니다.
# - 지인 사이트(fork) 발행 job은 삭제했습니다. main.py는 site-1·site-1775046458524 외의 사이트면 exit 1로 끝납니다.
# - 예약 재개는 AdSense 승인 뒤 사용자 결정으로만: on.schedule과 각 job의 if 조건을 함께 복원하세요.
# ═══════════════════════════════════════════════════════════════
on:
  workflow_dispatch:
    inputs:
      site_id:
        description: '대상 사이트 (all=두 사이트 모두)'
        type: choice
        required: false
        default: 'all'
        options:
          - all
          - site-1
          - site-1775046458524
      count:
        description: '발행 편수'
        required: false
        default: '1'
      dry_run:
        description: '드라이런'
        type: choice
        required: false
        default: 'false'
        options:
          - 'false'
          - 'true'
      pipeline:
        description: '파이프라인'
        type: choice
        required: false
        default: 'autoblog'
        options:
          - autoblog
      niche:
        description: '니치 필터 (빈값=전체)'
        required: false
        default: ''

# 편집자가 WordPress에서 확인 후 공개. 수동 실행도 초안만 저장합니다.
env:
  EDITORIAL_REVIEW_REQUIRED: "true"

permissions:
  contents: write

jobs:
  # ═══ planx-ai.com (site-1) ═══
  planx-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.repository == 'planxs-ai/wp-auto'
      && github.event_name == 'workflow_dispatch'
      && (inputs.site_id == '' || inputs.site_id == 'all' || inputs.site_id == 'site-1')

    env:
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      WP_URL: ${{ secrets.WP_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish planx-ai.com (drafts)
        env:
          FORCE_RUN: 'true'
          # 입력값은 스크립트에 직접 끼워 넣지 않고 환경변수로 넘긴다(따옴표·공백 안전).
          IN_COUNT: ${{ inputs.count || '1' }}
          IN_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          IN_PIPELINE: ${{ inputs.pipeline || 'autoblog' }}
          IN_NICHE: ${{ inputs.niche || '' }}
        run: |
          args=(--site-id site-1 --count "$IN_COUNT" --pipeline "$IN_PIPELINE" --golden)
          if [ "$IN_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$IN_NICHE" ]; then args+=(--niche "$IN_NICHE"); fi
          echo "▶ planx-ai.com: python scripts/main.py ${args[*]}"
          python scripts/main.py "${args[@]}"

      - name: Commit used keywords
        if: always()
        run: |
          git config user.email "bot@autoblog.com"
          git config user.name "AutoBlog Bot"

          for attempt in 1 2 3; do
            git add data/used_keywords.json || true
            git add data/quarantined_keywords.json || true
            git stash --include-untracked || true
            git pull --rebase || true
            git stash pop || true
            git add data/used_keywords.json || true
            git add data/quarantined_keywords.json || true
            git diff --staged --quiet && echo "No changes to commit" && break
            git commit -m "chore: update used keywords [planx-ai] $(date +%Y-%m-%d)"
            if git push; then
              echo "Push succeeded on attempt $attempt"
              break
            fi
            echo "Push failed on attempt $attempt, retrying in 5s..."
            git pull --rebase || true
            sleep 5
          done

  # ═══ bomissu.com (site-1775046458524) ═══
  bomissu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 예약 실행 없음. 수동 실행만 (2026-09-13). 이전 감속 스케줄 '30 23 * * *'은 재개 게이트 뒤에 복원 여부 결정.
    if: >-
      github.repository == 'planxs-ai/wp-auto'
      && github.event_name == 'workflow_dispatch'
      && (inputs.site_id == '' || inputs.site_id == 'all' || inputs.site_id == 'site-1775046458524')

    env:
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      WP_URL: ${{ secrets.BOMISSU_WP_URL || secrets.WP_URL }}
      WP_USERNAME: ${{ secrets.BOMISSU_WP_USERNAME || secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.BOMISSU_WP_APP_PASSWORD || secrets.WP_APP_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish bomissu.com (drafts)
        env:
          FORCE_RUN: 'true'
          IN_COUNT: ${{ inputs.count || '1' }}
          IN_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          IN_PIPELINE: ${{ inputs.pipeline || 'autoblog' }}
          IN_NICHE: ${{ inputs.niche || '' }}
        run: |
          args=(--site-id site-1775046458524 --count "$IN_COUNT" --pipeline "$IN_PIPELINE" --golden)
          if [ "$IN_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$IN_NICHE" ]; then args+=(--niche "$IN_NICHE"); fi
          echo "▶ bomissu.com: python scripts/main.py ${args[*]}"
          python scripts/main.py "${args[@]}"

      - name: Commit used keywords
        if: always()
        run: |
          git config user.email "bot@autoblog.com"
          git config user.name "AutoBlog Bot"

          for attempt in 1 2 3; do
            git add data/used_keywords.json || true
            git add data/quarantined_keywords.json || true
            git stash --include-untracked || true
            git pull --rebase || true
            git stash pop || true
            git add data/used_keywords.json || true
            git add data/quarantined_keywords.json || true
            git diff --staged --quiet && echo "No changes to commit" && break
            git commit -m "chore: update used keywords [bomissu] $(date +%Y-%m-%d)"
            if git push; then
              echo "Push succeeded on attempt $attempt"
              break
            fi
            echo "Push failed on attempt $attempt, retrying in 5s..."
            git pull --rebase || true
            sleep 5
          done
