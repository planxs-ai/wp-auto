name: Inject Custom CSS
# 관리자 대시보드(/api/setup) 또는 Actions 화면에서 수동 실행.
# WP 자격증명은 input 으로 받지 않는다(이벤트 payload·로그에 남음). GitHub secrets 에서만 읽는다.
on:
  workflow_dispatch:
    inputs:
      site_id:
        description: '대상 사이트 (site-1=planx-ai.com, site-1775046458524=bomissu.com)'
        type: choice
        required: true
        default: 'site-1'
        options:
          - 'site-1'
          - 'site-1775046458524'

permissions:
  contents: read

jobs:
  inject:
    runs-on: ubuntu-latest
    env:
      SITE_ID: ${{ inputs.site_id }}
      # 사이트별 secrets. 대상 사이트 secret 이 비어 있으면 다른 사이트 값으로 넘어가지 않고 빈 값이 된다.
      WP_URL: ${{ inputs.site_id == 'site-1' && secrets.WP_URL || inputs.site_id == 'site-1775046458524' && secrets.BOMISSU_WP_URL || '' }}
      WP_USERNAME: ${{ inputs.site_id == 'site-1' && secrets.WP_USERNAME || inputs.site_id == 'site-1775046458524' && secrets.BOMISSU_WP_USERNAME || '' }}
      WP_APP_PASSWORD: ${{ inputs.site_id == 'site-1' && secrets.WP_APP_PASSWORD || inputs.site_id == 'site-1775046458524' && secrets.BOMISSU_WP_APP_PASSWORD || '' }}
      # 선택: 없으면 Customizer 단계가 실패하고 XML-RPC 폴백으로 넘어간다
      WP_LOGIN_PASSWORD: ${{ inputs.site_id == 'site-1' && secrets.WP_LOGIN_PASSWORD || inputs.site_id == 'site-1775046458524' && secrets.BOMISSU_WP_LOGIN_PASSWORD || '' }}
    steps:
      - name: 자격증명 점검
        run: |
          if [ -z "$WP_URL" ] || [ -z "$WP_USERNAME" ] || [ -z "$WP_APP_PASSWORD" ]; then
            echo "::error::$SITE_ID 의 WP secrets 가 비어 있습니다 (site-1: WP_URL·WP_USERNAME·WP_APP_PASSWORD, bomissu: BOMISSU_ 접두사)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Customizer CSS 주입 (사이트 전체)
        id: customizer
        continue-on-error: true
        run: python scripts/inject_css_customizer.py
      - name: XML-RPC CSS 주입 (Customizer 실패 시 폴백)
        if: steps.customizer.outcome == 'failure'
        run: python scripts/inject_css.py
      - name: 기존 글 인라인 CSS 주입 (개별 글)
        run: python scripts/inject_css_to_posts.py
