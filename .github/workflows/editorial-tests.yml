name: Editorial readiness tests
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - 'requirements.txt'
      - '.github/workflows/publish.yml'
      - '.github/workflows/publish-golden.yml'
      - '.github/workflows/editorial-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/*.py
      - run: python -m unittest discover -s tests -v
