name: Golden AutoBlog + ETF Report

on:
  # 스케줄 비활성화 — publish.yml로 통합됨 (수동 실행만 가능)
  # schedule:
  #   - cron: '0 0 * * *'    # KST 09:00
  #   - cron: '0 11 * * *'   # KST 20:00
  workflow_dispatch:
    inputs:
      count:
        description: '발행 편수'
        required: false
        default: '2'
      dry_run:
        description: '드라이런 (true/false)'
        required: false
        default: 'false'
      niche:
        description: '니치/카테고리 필터 (빈값=전체)'
        required: false
        default: ''
      site_id:
        # 자유 입력을 받지 않는다: 선택지 밖 값은 GitHub이 dispatch 단계에서 거부한다.
        description: '대상 사이트 (all=두 사이트 모두)'
        type: choice
        required: false
        default: 'all'
        options:
          - all
          - site-1
          - site-1775046458524

# 편집자가 WordPress에서 확인 후 공개. 수동 실행도 초안만 저장합니다.
env:
  EDITORIAL_REVIEW_REQUIRED: "true"

permissions:
  contents: write

jobs:
  golden-publish:
    # 원본 저장소에서만 실행. upstream을 동기화한 fork에서 수동 실행해도 사용자 두 사이트를 건드리지 않는다.
    if: github.repository == 'planxs-ai/wp-auto'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # 사용자 소유 두 사이트만 (site_id는 선택지 입력, main.py는 그 외 site-id·WP 호스트면 exit 1)
        site: ${{ (inputs.site_id == 'site-1' || inputs.site_id == 'site-1775046458524') && fromJson(format('["{0}"]', inputs.site_id)) || fromJson('["site-1","site-1775046458524"]') }}

    env:
      WP_URL: ${{ secrets.WP_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      NAVER_REFRESH_TOKEN: ${{ secrets.NAVER_REFRESH_TOKEN }}
      NAVER_CAFE_CLUBID: ${{ secrets.NAVER_CAFE_CLUBID }}
      NAVER_CAFE_MENUID: ${{ secrets.NAVER_CAFE_MENUID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SITE_ID: ${{ matrix.site }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Golden AutoBlog (${{ matrix.site }}, drafts)
        env:
          # 수동 실행 전용. 입력값은 스크립트에 직접 끼워 넣지 않고 환경변수로 넘긴다(따옴표·공백 안전).
          IN_SITE: ${{ matrix.site }}
          IN_COUNT: ${{ inputs.count || '2' }}
          IN_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          IN_NICHE: ${{ inputs.niche || '' }}
        run: |
          args=(--site-id "$IN_SITE" --count "$IN_COUNT" --pipeline autoblog --golden)
          if [ "$IN_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$IN_NICHE" ]; then args+=(--niche "$IN_NICHE"); fi
          echo "▶ python scripts/main.py ${args[*]}"
          python scripts/main.py "${args[@]}"

      # ETF 리포트는 etf-report.yml (KST 16:30)에서 단독 실행

      - name: Commit used keywords
        if: always()
        env:
          # matrix 값도 셸에 직접 끼워 넣지 않는다.
          IN_SITE: ${{ matrix.site }}
        run: |
          git config user.email "bot@autoblog.com"
          git config user.name "AutoBlog Bot"
          git pull --rebase || true
          git add data/used_keywords.json || true
          git add data/quarantined_keywords.json || true
          git diff --staged --quiet || git commit -m "chore: update used keywords $(date +%Y-%m-%d) [golden/${IN_SITE}]"
          git push || true
